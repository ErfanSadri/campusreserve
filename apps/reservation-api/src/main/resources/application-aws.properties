# Activated only by SPRING_PROFILES_ACTIVE=aws. Local Compose defaults remain
# in application.properties.
spring.datasource.url=${CAMPUSRESERVE_DATABASE_URL}
spring.datasource.username=${CAMPUSRESERVE_DATABASE_USERNAME}
spring.datasource.password=${CAMPUSRESERVE_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require

spring.data.redis.host=${CAMPUSRESERVE_REDIS_HOST}
spring.data.redis.port=${CAMPUSRESERVE_REDIS_PORT:6379}
spring.data.redis.password=${CAMPUSRESERVE_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# MSK supplies a comma-separated TLS/IAM bootstrap broker list at runtime.
spring.kafka.bootstrap-servers=${CAMPUSRESERVE_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
