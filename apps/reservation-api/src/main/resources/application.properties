spring.application.name=reservation-api

spring.datasource.url=${CAMPUSRESERVE_DATABASE_URL:jdbc:postgresql://localhost:5434/campusreserve}
spring.datasource.username=${CAMPUSRESERVE_DATABASE_USERNAME:campusreserve}
spring.datasource.password=${CAMPUSRESERVE_DATABASE_PASSWORD:campusreserve}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Redis and Kafka are reported when configured; neither controls database-backed readiness.
management.endpoint.health.group.dependencies.include=*
management.tracing.sampling.probability=${CAMPUSRESERVE_TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.enabled=${CAMPUSRESERVE_OTLP_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${CAMPUSRESERVE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] correlationId=%X{correlationId:-} %logger{36} - %msg%n

spring.data.redis.host=${CAMPUSRESERVE_REDIS_HOST:localhost}
spring.data.redis.port=${CAMPUSRESERVE_REDIS_PORT:6380}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false

campusreserve.kafka.host=${CAMPUSRESERVE_KAFKA_HOST:localhost}
campusreserve.kafka.port=${CAMPUSRESERVE_KAFKA_PORT:9094}
spring.kafka.bootstrap-servers=${campusreserve.kafka.host}:${campusreserve.kafka.port}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=campusreserve-reservation-audit-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.erfansadri.campusreserve.reservation.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.erfansadri.campusreserve.reservation.messaging.ReservationLifecycleEvent

# At-least-once delivery with database-backed idempotent consumer processing.
# Listener failures are retried twice with a 250 ms backoff before DLT routing.

campusreserve.outbox.publisher.enabled=${CAMPUSRESERVE_OUTBOX_PUBLISHER_ENABLED:true}
campusreserve.outbox.publisher.fixed-delay-ms=${CAMPUSRESERVE_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}

campusreserve.expiration.worker.enabled=${CAMPUSRESERVE_EXPIRATION_WORKER_ENABLED:true}
campusreserve.expiration.worker.fixed-delay-ms=${CAMPUSRESERVE_EXPIRATION_WORKER_FIXED_DELAY_MS:5000}
campusreserve.expiration.worker.batch-size=${CAMPUSRESERVE_EXPIRATION_WORKER_BATCH_SIZE:100}
