services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: campusreserve
      POSTGRES_USER: campusreserve
      POSTGRES_PASSWORD: campusreserve
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - campusreserve-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusreserve -d campusreserve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusreserve-postgres-data: