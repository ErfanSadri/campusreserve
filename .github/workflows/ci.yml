name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate API and container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/reservation-api/pom.xml

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate local harness syntax
        run: bash -n load-tests/scripts/*.sh

      - name: Start integration dependencies
        run: docker compose up -d postgres redis kafka

      - name: Wait for integration dependencies
        run: |
          set -euo pipefail
          for service in postgres redis kafka; do
            container="$(docker compose ps -q "$service")"
            for attempt in {1..60}; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              if [ "$health" = healthy ]; then
                break
              fi
              if [ "$attempt" = 60 ]; then
                echo "$service did not become healthy (last status: $health)" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run full Maven verification
        working-directory: apps/reservation-api
        run: ./mvnw -B verify

      - name: Build reservation API image
        run: docker build --tag campusreserve/reservation-api:${{ github.sha }} apps/reservation-api

      - name: Smoke test reservation API image
        run: |
          set -euo pipefail
          docker run --detach --rm --name campusreserve-api-smoke --network host \
            --env CAMPUSRESERVE_DATABASE_URL=jdbc:postgresql://127.0.0.1:5434/campusreserve \
            --env CAMPUSRESERVE_REDIS_HOST=127.0.0.1 \
            --env CAMPUSRESERVE_REDIS_PORT=6380 \
            --env CAMPUSRESERVE_KAFKA_HOST=127.0.0.1 \
            --env CAMPUSRESERVE_KAFKA_PORT=9094 \
            campusreserve/reservation-api:${{ github.sha }}
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Reservation API container did not become ready" >&2
          docker logs --tail 200 campusreserve-api-smoke || true
          exit 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/reservation-api/target/surefire-reports
          if-no-files-found: ignore

      - name: Print dependency diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 postgres redis kafka
          docker logs --tail 200 campusreserve-api-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm --force campusreserve-api-smoke || true

      - name: Stop integration dependencies
        if: always()
        run: docker compose down --remove-orphans

  publish:
    name: Publish GHCR image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image tags
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${REPOSITORY_OWNER,,}/campusreserve-reservation-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" --tag "$IMAGE_NAME:main" apps/reservation-api
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:main"
